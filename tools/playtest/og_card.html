<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffe3f1; font-family: Nunito, sans-serif; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(560px 420px at 900px 320px, rgba(122,92,230,0.35), transparent 70%),
    radial-gradient(420px 300px at 200px 110px, rgba(255,120,170,0.30), transparent 70%); }
  .words { position: absolute; left: 68px; top: 44px; width: 590px; }
  .title { font-weight: 900; font-size: 96px; line-height: 0.9; letter-spacing: -2px;
    -webkit-text-stroke: 4px #2e1d5c; paint-order: stroke fill; }
  .title span { display: block; }
  .a { color: #ff6fa8; } .b { color: #7a5ce6; } .c { color: #ffd84d; }
  .tag { margin-top: 20px; color: #2e1d5c; font-weight: 900; font-size: 31px; line-height: 1.15; }
  .sub { margin-top: 14px; color: #5b45a8; font-weight: 800; font-size: 23px; line-height: 1.35; }
  .chips { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-weight: 900; font-size: 18px; padding: 7px 14px; border-radius: 999px; background: #7a5ce6; color: #fff; border: 3px solid #2e1d5c; }
  .site { position: absolute; left: 68px; bottom: 28px; color: #7a5ce6; font-weight: 900; font-size: 22px; }
  .alley { position: absolute; right: 90px; top: -30px; width: 380px; height: 624px; overflow: hidden;
    border-radius: 30px; border: 5px solid #2e1d5c; box-shadow: 0 0 0 10px #ffd84d, 0 20px 60px rgba(46,29,92,0.35);
    transform: rotate(4deg); background: #ffe3f1; }
  .alley img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="words">
    <div class="title"><span class="a">SKEE</span><span class="b">SKEE</span><span class="c">SKEE</span></div>
    <div class="tag">skee-ball with a slot machine in it</div>
    <div class="sub">Pull the lever, flick the ball up the lane, and match the reels to beat each round's score.</div>
    <div class="chips"><span class="chip">12 antes</span><span class="chip">7 boss machines</span><span class="chip">plays on phones</span></div>
  </div>
  <div class="site">bobbby.online/skee</div>
  <div class="alley"><img src="ALLEY_PNG"></div>
</body></html>
